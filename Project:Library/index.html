<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="showform">Add a New Book</button>
    <dialog id="libr">
        <form id="libform">
            <label>Enter Author name</label>
            <input id="aname" type="text">
            <br><br>
            <label>Enter book title</label>
            <input id="bname" type="text">
            <br><br>
            <label>Enter No. of pages</label>
            <input id="npage">
            <br><br>
            <button type="submit" id="subs">Submit</button>
        </form>
    </dialog>
    <button id="disph">Display</button>
    <div id="display">
        Library
    </div>
    <script src="java.js"></script>
</body>

</html>
